name: Build & Test

on:
  push:
    branches: [master, dev, 'claude/**']
  pull_request:
    branches: [master, dev]

jobs:
  # ── C++ / Windows MSVC ─────────────────────────────────────────────────────
  cpp-windows-msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure conduit (with tests)
        run: >
          cmake -B build-conduit -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build conduit
        run: cmake --build build-conduit --config ${{ matrix.build_type }} --parallel

      - name: Run conduit tests
        run: |
          cd build-conduit
          ctest --build-config ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Configure xcvr
        run: >
          cmake -B build-xcvr -S xcvr
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build xcvr
        run: cmake --build build-xcvr --config ${{ matrix.build_type }} --parallel

      - name: Smoke-test xcvr apps (server + client for 5 seconds)
        shell: pwsh
        run: |
          $buildDir = "build-xcvr/${{ matrix.build_type }}"
          if (-not (Test-Path "$buildDir/dummy_peer.exe")) {
            $buildDir = "build-xcvr"
          }

          # Start server in background
          $server = Start-Process -FilePath "$buildDir/dummy_peer.exe" `
            -ArgumentList "server","--port","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 2

          # Start client in background
          $client = Start-Process -FilePath "$buildDir/poc_app.exe" `
            -ArgumentList "127.0.0.1","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 5

          # Stop both
          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }

          # Wait briefly for output files to finalize
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server stdout ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stdout ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          # Verify both produced output (basic smoke check)
          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          if ($serverOut -match "Listening" -and $clientOut -match "Started") {
            Write-Host "Smoke test PASSED: both apps started successfully"
          } else {
            Write-Host "Smoke test FAILED: apps did not start properly"
            if ($client.HasExited) {
              Write-Host "Client exit code: $($client.ExitCode)"
            }
            exit 1
          }

  # ── C++ / Windows MinGW (cross-compilation parity) ─────────────────────────
  cpp-windows-mingw:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        shell: pwsh
        run: |
          choco install mingw --version=13.2.0 -y --no-progress
          # Refresh session PATH so we can find the newly-installed gcc
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          $mingwBin = (Get-Command gcc -ErrorAction Stop).Source | Split-Path -Parent
          Write-Host "MinGW bin: $mingwBin"
          echo $mingwBin | Out-File -Append -FilePath $env:GITHUB_PATH
          gcc --version

      - name: Configure xcvr (MinGW)
        run: >
          cmake -B build-mingw -S xcvr -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build xcvr (MinGW)
        run: cmake --build build-mingw --parallel

  # ── C++ / Linux GCC ────────────────────────────────────────────────────────
  cpp-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure conduit (with tests)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit
        run: cmake --build build --parallel

      - name: Run conduit tests
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Configure and build xcvr
        run: |
          cmake -B build-xcvr -S xcvr -DCMAKE_BUILD_TYPE=Release
          cmake --build build-xcvr --parallel

      - name: Smoke-test xcvr apps (server + client for 5 seconds)
        run: |
          cd build-xcvr
          ./dummy_peer server --port 15000 --interval-ms 500 &
          SERVER_PID=$!
          sleep 2
          timeout 5 ./poc_app 127.0.0.1 15000 --interval-ms 500 || true
          kill $SERVER_PID 2>/dev/null || true
          echo "Smoke test completed"

  # ── Java 11 JNI / Linux ────────────────────────────────────────────────────
  java11-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure conduit (CABI + JNI + bgen)
        run: >
          cmake -B build-conduit -S conduit
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_BGEN=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit (CABI + JNI + bgen)
        run: cmake --build build-conduit --parallel

      - name: Generate Java sources from BMDL
        run: |
          BGEN=./build-conduit/bgen
          $BGEN --input xcvr-java11/asterix/asterix.bmdl.xml \
                --output xcvr-java11/asterix/generated --language java
          $BGEN --input xcvr-java11/asterix-alt/asterix-alt.bmdl.xml \
                --output xcvr-java11/asterix-alt/generated --language java

      - name: Install conduit-java to local Maven repo
        run: mvn install -q -f conduit/bindings/java/pom.xml

      - name: Build xcvr-java11
        run: >
          mvn package -q -f xcvr-java11/pom.xml
          -Dconduit.build.dir=${{ github.workspace }}/build-conduit

      - name: Smoke-test xcvr-java11 (DummyPeer server + PocApp client)
        run: |
          BUILD_DIR=${{ github.workspace }}/build-conduit

          # Start DummyPeer in server mode in the background
          mvn exec:java -f xcvr-java11/pom.xml -PrunDummyPeer \
            -Dconduit.build.dir=$BUILD_DIR \
            -Dexec.appArgs="server --port 15001 --interval-ms 500" \
            > server_out.txt 2>&1 &
          SERVER_PID=$!

          sleep 3

          # Run PocApp client for 5 seconds
          timeout 5 mvn exec:java -f xcvr-java11/pom.xml -PrunPocApp \
            -Dconduit.build.dir=$BUILD_DIR \
            -Dexec.appArgs="127.0.0.1 15001 --interval-ms 500" \
            > client_out.txt 2>&1 || true

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          echo "=== Server output ==="
          cat server_out.txt
          echo "=== Client output ==="
          cat client_out.txt

          # Verify both apps started successfully (basic smoke check)
          if grep -q "Listening" server_out.txt && grep -q "Started" client_out.txt; then
            echo "Smoke test PASSED: both Java 11 JNI apps started successfully"
          else
            echo "Smoke test FAILED: apps did not start properly"
            exit 1
          fi

  # ── Java 11 JNI / Windows ──────────────────────────────────────────────────
  java11-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure conduit (CABI + JNI + bgen)
        run: >
          cmake -B build-conduit -S conduit
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_BGEN=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit (CABI + JNI + bgen)
        run: cmake --build build-conduit --config Release --parallel

      - name: Generate Java sources from BMDL
        shell: pwsh
        run: |
          # With MSVC multi-config generator, bgen.exe lands in build-conduit/Release/
          $bgen = "build-conduit/Release/bgen.exe"
          & $bgen --input xcvr-java11/asterix/asterix.bmdl.xml `
                  --output xcvr-java11/asterix/generated --language java
          & $bgen --input xcvr-java11/asterix-alt/asterix-alt.bmdl.xml `
                  --output xcvr-java11/asterix-alt/generated --language java

      - name: Install conduit-java to local Maven repo
        run: mvn install -q -f conduit/bindings/java/pom.xml

      - name: Build xcvr-java11
        run: >
          mvn package -q -f xcvr-java11/pom.xml
          -Dconduit.build.dir=${{ github.workspace }}/build-conduit/Release

      - name: Smoke-test xcvr-java11 (DummyPeer server + PocApp client)
        shell: pwsh
        run: |
          # conduit_jni.dll lands in build-conduit/Release/ with MSVC
          $BuildDir = "${{ github.workspace }}\build-conduit\Release"

          # Start DummyPeer in server mode in the background
          $server = Start-Process -FilePath "mvn" `
            -ArgumentList @(
              "exec:java", "-f", "xcvr-java11/pom.xml", "-PrunDummyPeer",
              "-Dconduit.build.dir=$BuildDir",
              "-Dexec.appArgs=server --port 15001 --interval-ms 500"
            ) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 3

          # Start PocApp client in background, then wait 5 seconds
          $client = Start-Process -FilePath "mvn" `
            -ArgumentList @(
              "exec:java", "-f", "xcvr-java11/pom.xml", "-PrunPocApp",
              "-Dconduit.build.dir=$BuildDir",
              "-Dexec.appArgs=127.0.0.1 15001 --interval-ms 500"
            ) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 5

          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server output ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client output ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          # Verify both apps started successfully (basic smoke check)
          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          if ($serverOut -match "Listening" -and $clientOut -match "Started") {
            Write-Host "Smoke test PASSED: both Java 11 JNI apps started successfully"
          } else {
            Write-Host "Smoke test FAILED: apps did not start properly"
            if ($client.HasExited) {
              Write-Host "Client exit code: $($client.ExitCode)"
            }
            exit 1
          }
