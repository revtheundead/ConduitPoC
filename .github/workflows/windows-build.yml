        run: cmake --build conduit/build --config Release --parallel

      - name: Generate Python sources from BMDL
        shell: pwsh
        run: |
          $bgen = "conduit/build/bgen/Release/bgen.exe"
          & $bgen --input xcvr-python/asterix/asterix.bmdl.xml `
                  --output xcvr-python/asterix/generated --language python
          & $bgen --input xcvr-python/asterix-alt/asterix-alt.bmdl.xml `
