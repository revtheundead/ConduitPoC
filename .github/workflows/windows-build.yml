          PYTHONUNBUFFERED: "1"
        run: |
          # Start DummyPeer in server mode in the background
          $server = Start-Process -FilePath "python" `
            -ArgumentList "-m", "src.dummy_peer", "server", "--port", "15003", "--interval-ms", "500" `
            -WorkingDirectory "xcvr-python" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 2

          # Start PocApp client in background, then wait 5 seconds
          $client = Start-Process -FilePath "python" `
            -ArgumentList "-m", "src.poc_app", "127.0.0.1", "15003", "--interval-ms", "500" `
            -WorkingDirectory "xcvr-python" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput client_out.txt `
