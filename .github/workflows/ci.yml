      - name: Build xcvr-java21
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\conduit\build"
          $cabiPath = "${{ github.workspace }}\conduit\lib\conduit_cabi.dll"
          mvn package -q -f conduit/examples/xcvr-java21/pom.xml "-Dskip.bgen=true" "-Dconduit.build.dir=$buildDir" "-Dconduit.cabi.path=$cabiPath"

      - name: Smoke-test xcvr-java21 (DummyPeer server + PocApp client)
        shell: pwsh
        env:
          MAVEN_OPTS: "--enable-preview --enable-native-access=ALL-UNNAMED"
        run: |
          $BuildDir = "${{ github.workspace }}\conduit\build"
          $CabiPath = "${{ github.workspace }}\conduit\lib\conduit_cabi.dll"
          $env:PATH = "${{ github.workspace }}\conduit\lib;$env:PATH"

          # Start DummyPeer in server mode in the background
          $server = Start-Process -FilePath "mvn" `
            -ArgumentList @(
              "exec:java", "-f", "conduit/examples/xcvr-java21/pom.xml", "-PrunDummyPeer",
              "-Dconduit.build.dir=$BuildDir",
              "-Dconduit.cabi.path=$CabiPath",
              '"-Dexec.appArgs=server --port 15002 --interval-ms 500"'
            ) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 5

          # Start PocApp client in background, then wait for it to initialize
          $client = Start-Process -FilePath "mvn" `
            -ArgumentList @(
              "exec:java", "-f", "conduit/examples/xcvr-java21/pom.xml", "-PrunPocApp",
              "-Dconduit.build.dir=$BuildDir",
              "-Dconduit.cabi.path=$CabiPath",
              '"-Dexec.appArgs=127.0.0.1 15002 --interval-ms 500"'
            ) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 10

          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server output ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client output ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          if ($serverOut -match "Listening" -and $clientOut -match "Started") {
            Write-Host "Smoke test PASSED: both Java 21 Panama FFI apps started successfully"
          } else {
            Write-Host "Smoke test FAILED: apps did not start properly"
            if ($client.HasExited) {
              Write-Host "Client exit code: $($client.ExitCode)"
            }
            exit 1
          }

      - name: Run standalone test suite
        shell: cmd
        run: conduit\scripts\run_tests.bat conduit\build

  # ── Python / Linux ─────────────────────────────────────────────────────────
  python-linux:
    runs-on: ubuntu-latest

    steps:
