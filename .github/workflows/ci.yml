      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure conduit (CABI + bgen + tests + examples)
        run: >
          cmake -B conduit/build -S conduit
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit (CABI + bgen + tests + examples)
        run: cmake --build conduit/build --parallel

      - name: Run conduit tests
        run: cd conduit/build && ctest --output-on-failure --timeout 120

      - name: Generate Python sources from BMDL
        run: |
          BGEN=./conduit/build/bgen/bgen
          $BGEN --input conduit/examples/xcvr-python/asterix/asterix.bmdl.xml \
                --output conduit/examples/xcvr-python/asterix/generated --language python
          $BGEN --input conduit/examples/xcvr-python/asterix-alt/asterix-alt.bmdl.xml \
                --output conduit/examples/xcvr-python/asterix-alt/generated --language python

      - name: Install conduit Python bindings and xcvr-python
        run: |
          pip install conduit/bindings/python/
          pip install conduit/examples/xcvr-python/

      - name: Smoke-test xcvr-python (DummyPeer server + PocApp client)
        env:
          CONDUIT_CABI_LIB: ${{ github.workspace }}/conduit/lib/libconduit_cabi.so
          PYTHONUNBUFFERED: "1"
        run: |
          cd conduit/examples/xcvr-python

          python -m src.dummy_peer server --port 15003 --interval-ms 500 \
            > ../../../server_out.txt 2>&1 &
          SERVER_PID=$!

          sleep 2

          timeout 5 python -m src.poc_app 127.0.0.1 15003 --interval-ms 500 \
            > ../../../client_out.txt 2>&1 || true

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          cd ../../..

          echo "=== Server output ==="
          cat server_out.txt
          echo "=== Client output ==="
          cat client_out.txt

          if grep -q "Listening" server_out.txt && grep -q "Started" client_out.txt; then
            echo "Smoke test PASSED: both Python apps started successfully"
          else
            echo "Smoke test FAILED: apps did not start properly"
