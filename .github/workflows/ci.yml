            -Dconduit.cabi.path=$CABI_PATH \
            -Dexec.appArgs="127.0.0.1 15002 --interval-ms 500" \
            > client_out.txt 2>&1 || true

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          echo "=== Server output ==="
          cat server_out.txt
          echo "=== Client output ==="
          cat client_out.txt

          if grep -q "Listening" server_out.txt && grep -q "Started" client_out.txt; then
            echo "Smoke test PASSED: both Java 21 Panama FFI apps started successfully"
