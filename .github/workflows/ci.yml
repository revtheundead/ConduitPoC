  # ── C++ / Static Analysis (clang-tidy) ─────────────────────────────────────
  cpp-clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang 19 and clang-tidy
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc
          . /etc/lsb-release
          echo "deb http://apt.llvm.org/${DISTRIB_CODENAME}/ llvm-toolchain-${DISTRIB_CODENAME}-19 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update -q
          sudo apt-get install -y clang-19 clang-tidy-19

      - name: Set up JDK for JNI headers
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure conduit (for compile_commands.json)
        env:
          CC: clang-19
          CXX: clang++-19
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_CODEC_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_TESTS=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on conduit sources
        run: |
          # Only analyse first-party files known to cmake (skip third_party/)
          jq -r '.[].file' build/compile_commands.json | sort -u | \
            grep -v third_party/ | \
            xargs clang-tidy-19 -p build \
              --checks='-*,bugprone-*,-bugprone-easily-swappable-parameters,-bugprone-branch-clone,-bugprone-narrowing-conversions' \
              --warnings-as-errors='bugprone-*' \
              2>&1 | tee clang-tidy-output.txt || true
          # Fail only on bugprone warnings promoted to errors
          if grep -q 'warnings-as-errors' clang-tidy-output.txt; then
            echo "clang-tidy found bugprone issues"
            exit 1
          fi
