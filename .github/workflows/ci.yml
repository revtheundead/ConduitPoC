name: Build & Test

on:
  push:
    branches: [master, dev, 'claude/**']
  pull_request:
    branches: [master, dev]

jobs:
  # ── C++ / Windows MSVC ─────────────────────────────────────────────────────
  cpp-windows-msvc:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Configure conduit (with tests + examples)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build conduit
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run conduit tests
        run: |
          cd build
          ctest --build-config ${{ matrix.build_type }} --output-on-failure --timeout 120

      - name: Smoke-test xcvr apps (server + client for 5 seconds)
        shell: pwsh
        run: |
          $buildDir = "conduit/examples/xcvr-cpp"

          # Start server in background
          $server = Start-Process -FilePath "$buildDir/dummy_peer.exe" `
            -ArgumentList "server","--port","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 2

          # Start client in background
          $client = Start-Process -FilePath "$buildDir/poc_app.exe" `
            -ArgumentList "127.0.0.1","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 5

          # Stop both
          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }

          # Wait briefly for output files to finalize
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server stdout ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stdout ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          # Verify startup AND actual message exchange
          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          if ($serverOut -match "Listening" -and $clientOut -match "Started" -and
              $serverOut -match "\[SEND\]" -and $clientOut -match "\[SEND\]") {
            Write-Host "Smoke test PASSED: both apps started and exchanged messages"
          } else {
            Write-Host "Smoke test FAILED: apps did not start or communicate properly"
            if ($client.HasExited) {
              Write-Host "Client exit code: $($client.ExitCode)"
            }
            exit 1
          }

      - name: Run standalone test suite
        shell: cmd
        run: conduit\scripts\run_tests.bat build

  # ── C++ / Windows MinGW (cross-compilation parity) ─────────────────────────
  cpp-windows-mingw:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up MinGW
        shell: pwsh
        run: |
          choco install mingw --version=13.2.0 -y --no-progress
          # Refresh session PATH so we can find the newly-installed gcc
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          $mingwBin = (Get-Command gcc -ErrorAction Stop).Source | Split-Path -Parent
          Write-Host "MinGW bin: $mingwBin"
          echo $mingwBin | Out-File -Append -FilePath $env:GITHUB_PATH
          gcc --version

      - name: Configure conduit with tests + examples (MinGW)
        run: >
          cmake -B build-mingw -S conduit -G "MinGW Makefiles"
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit with tests + examples (MinGW)
        run: cmake --build build-mingw --parallel

      - name: Run conduit tests (MinGW)
        run: cd build-mingw && ctest --output-on-failure --timeout 120

      - name: Smoke-test xcvr apps (MinGW)
        shell: pwsh
        run: |
          $buildDir = "conduit/examples/xcvr-cpp"

          # Start server in background
          # MinGW statically-linked builds may take longer to initialize on CI
          $server = Start-Process -FilePath "$buildDir/dummy_peer.exe" `
            -ArgumentList "server","--port","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 5

          # Start client in background
          $client = Start-Process -FilePath "$buildDir/poc_app.exe" `
            -ArgumentList "127.0.0.1","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 10

          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server stdout ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stdout ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          if ($serverOut -match "Listening" -and $clientOut -match "Started" -and
              $serverOut -match "\[SEND\]" -and $clientOut -match "\[SEND\]") {
            Write-Host "Smoke test PASSED: both MinGW apps started and exchanged messages"
          } else {
            Write-Host "Smoke test FAILED: apps did not start or communicate properly"
            exit 1
          }

      - name: Run standalone test suite (MinGW)
        shell: cmd
        run: conduit\scripts\run_tests.bat build-mingw

  # ── C++ / Windows Clang ───────────────────────────────────────────────────
  cpp-windows-clang:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM MinGW
        shell: pwsh
        run: |
          $llvmMingwVer = "20250114"
          $llvmMingwUrl = "https://github.com/mstorsjo/llvm-mingw/releases/download/$llvmMingwVer/llvm-mingw-$llvmMingwVer-ucrt-x86_64.zip"
          $zipPath = "$env:RUNNER_TEMP\llvm-mingw.zip"
          $installDir = "C:\llvm-mingw"
          Write-Host "Downloading LLVM MinGW $llvmMingwVer..."
          Invoke-WebRequest -Uri $llvmMingwUrl -OutFile $zipPath
          Write-Host "Extracting..."
          Expand-Archive -Path $zipPath -DestinationPath $env:RUNNER_TEMP
          Move-Item "$env:RUNNER_TEMP\llvm-mingw-$llvmMingwVer-ucrt-x86_64" $installDir
          echo "$installDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$installDir\bin\clang++.exe" --version

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment
          ninja --version

      - name: Configure conduit (Clang LLVM MinGW, with tests + examples)
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -B build -S conduit -G Ninja
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit
        run: cmake --build build --parallel

      - name: Run conduit tests
        run: |
          cd build
          ctest --output-on-failure --timeout 120

      - name: Smoke-test xcvr apps (server + client for 10 seconds)
        shell: pwsh
        run: |
          $buildDir = "conduit/examples/xcvr-cpp"

          # LLVM MinGW / Clang builds may take longer to initialize on CI
          $server = Start-Process -FilePath "$buildDir/dummy_peer.exe" `
            -ArgumentList "server","--port","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 5

          $client = Start-Process -FilePath "$buildDir/poc_app.exe" `
            -ArgumentList "127.0.0.1","15000","--interval-ms","500" `
            -PassThru -NoNewWindow -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 10

          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server stdout ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stdout ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          # Verify startup AND actual message exchange
          if ($serverOut -match "Listening" -and $clientOut -match "Started" -and
              $serverOut -match "\[SEND\]" -and $clientOut -match "\[SEND\]") {
            Write-Host "Smoke test PASSED: both Clang apps started and exchanged messages"
          } else {
            Write-Host "Smoke test FAILED: apps did not start or communicate properly"
            exit 1
          }

      - name: Run standalone test suite
        shell: cmd
        run: conduit\scripts\run_tests.bat build

  # ── C++ / Linux GCC ────────────────────────────────────────────────────────
  cpp-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure conduit (with tests + examples)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit
        run: cmake --build build --parallel

      - name: Run conduit tests
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Smoke-test xcvr apps (server + client for 5 seconds)
        run: |
          cd conduit/examples/xcvr-cpp
          ./dummy_peer server --port 15000 --interval-ms 500 > ../../../server_out.txt 2>&1 &
          SERVER_PID=$!
          sleep 2
          ./poc_app 127.0.0.1 15000 --interval-ms 500 > ../../../client_out.txt 2>&1 &
          CLIENT_PID=$!
          sleep 5
          kill $CLIENT_PID 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          wait $CLIENT_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          cd ../../..
          echo "=== Server output ==="
          cat server_out.txt
          echo "=== Client output ==="
          cat client_out.txt
          # Verify startup AND actual message exchange
          if grep -q "Listening" server_out.txt && grep -q "Started" client_out.txt &&
             grep -q "\[SEND\]" server_out.txt && grep -q "\[SEND\]" client_out.txt; then
            echo "Smoke test PASSED"
          else
            echo "Smoke test FAILED"
            exit 1
          fi

      - name: Run standalone test suite
        run: conduit/scripts/run_tests.sh build

  # ── Java 11 JNI / Linux ────────────────────────────────────────────────────
  java11-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure conduit (CABI + JNI + bgen + tests + examples)
        run: >
          cmake -B build-conduit -S conduit
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit (CABI + JNI + bgen + tests + examples)
        run: cmake --build build-conduit --parallel

      - name: Run conduit tests
        run: cd build-conduit && ctest --output-on-failure --timeout 120

      - name: Generate Java sources from BMDL
        run: |
          BGEN=./build-conduit/bgen/bgen
          $BGEN --input conduit/examples/xcvr-java11/asterix/asterix.bmdl.xml \
                --output conduit/examples/xcvr-java11/asterix/generated --language java
          $BGEN --input conduit/examples/xcvr-java11/asterix-alt/asterix-alt.bmdl.xml \
                --output conduit/examples/xcvr-java11/asterix-alt/generated --language java

      - name: Install conduit-java to local Maven repo
        run: mvn install -q -f conduit/bindings/java/pom.xml

      - name: Build xcvr-java11
        run: >
          mvn package -q -f conduit/examples/xcvr-java11/pom.xml
          -Dskip.bgen=true
          -Dconduit.build.dir=${{ github.workspace }}/build-conduit

      - name: Smoke-test xcvr-java11 (DummyPeer server + PocApp client)
        run: |
          BUILD_DIR=${{ github.workspace }}/build-conduit
          JNI_LIB=${{ github.workspace }}/conduit/lib/libconduit_jni.so

          # Start DummyPeer in server mode in the background
          mvn exec:java -f conduit/examples/xcvr-java11/pom.xml -PrunDummyPeer \
            -Dconduit.build.dir=$BUILD_DIR \
            -Dconduit.jni.path=$JNI_LIB \
            -Dexec.appArgs="server --port 15001 --interval-ms 500" \
            > server_out.txt 2>&1 &
          SERVER_PID=$!

          sleep 3

          # Run PocApp client for 5 seconds
          timeout 5 mvn exec:java -f conduit/examples/xcvr-java11/pom.xml -PrunPocApp \
            -Dconduit.build.dir=$BUILD_DIR \
            -Dconduit.jni.path=$JNI_LIB \
            -Dexec.appArgs="127.0.0.1 15001 --interval-ms 500" \
            > client_out.txt 2>&1 || true

          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true

          echo "=== Server output ==="
          cat server_out.txt
          echo "=== Client output ==="
          cat client_out.txt

          # Verify both apps started successfully (basic smoke check)
          if grep -q "Listening" server_out.txt && grep -q "Started" client_out.txt; then
            echo "Smoke test PASSED: both Java 11 JNI apps started successfully"
          else
            echo "Smoke test FAILED: apps did not start properly"
            exit 1
          fi

      - name: Run standalone test suite
        run: conduit/scripts/run_tests.sh build-conduit

  # ── Java 11 JNI / Windows ──────────────────────────────────────────────────
  java11-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Configure conduit (CABI + JNI + bgen + tests + examples)
        run: >
          cmake -B build-conduit -S conduit
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_EXAMPLES=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build conduit (CABI + JNI + bgen + tests + examples)
        run: cmake --build build-conduit --config Release --parallel

      - name: Run conduit tests
        run: |
          cd build-conduit
          ctest --build-config Release --output-on-failure --timeout 120

      - name: Generate Java sources from BMDL
        shell: pwsh
        run: |
          # CMake config flattens all configs into bgen/ (no Release/ subdirectory)
          $bgen = "build-conduit/bgen/bgen.exe"
          & $bgen --input conduit/examples/xcvr-java11/asterix/asterix.bmdl.xml `
                  --output conduit/examples/xcvr-java11/asterix/generated --language java
          & $bgen --input conduit/examples/xcvr-java11/asterix-alt/asterix-alt.bmdl.xml `
                  --output conduit/examples/xcvr-java11/asterix-alt/generated --language java

      - name: Install conduit-java to local Maven repo
        run: mvn install -q -f conduit/bindings/java/pom.xml

      - name: Build xcvr-java11
        shell: pwsh
        run: |
          $buildDir = "${{ github.workspace }}\build-conduit"
          mvn package -q -f conduit/examples/xcvr-java11/pom.xml "-Dskip.bgen=true" "-Dconduit.build.dir=$buildDir"

      - name: Smoke-test xcvr-java11 (DummyPeer server + PocApp client)
        shell: pwsh
        run: |
          $BuildDir = "${{ github.workspace }}\build-conduit"
          $JniLib = "${{ github.workspace }}\conduit\lib\conduit_jni.dll"

          # Add lib dir to PATH so Windows can find conduit_cabi.dll
          # (dependent DLL of conduit_jni.dll) during library loading
          $env:PATH = "${{ github.workspace }}\conduit\lib;$env:PATH"

          # Start DummyPeer in server mode in the background
          $server = Start-Process -FilePath "mvn" `
            -ArgumentList @(
              "exec:java", "-f", "conduit/examples/xcvr-java11/pom.xml", "-PrunDummyPeer",
              "-Dconduit.build.dir=$BuildDir",
              "-Dconduit.jni.path=$JniLib",
              '"-Dexec.appArgs=server --port 15001 --interval-ms 500"'
            ) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput server_out.txt `
            -RedirectStandardError server_err.txt

          Start-Sleep -Seconds 3

          # Start PocApp client in background, then wait 5 seconds
          $client = Start-Process -FilePath "mvn" `
            -ArgumentList @(
              "exec:java", "-f", "conduit/examples/xcvr-java11/pom.xml", "-PrunPocApp",
              "-Dconduit.build.dir=$BuildDir",
              "-Dconduit.jni.path=$JniLib",
              '"-Dexec.appArgs=127.0.0.1 15001 --interval-ms 500"'
            ) `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput client_out.txt `
            -RedirectStandardError client_err.txt

          Start-Sleep -Seconds 5

          if (!$client.HasExited) { $client.Kill() }
          if (!$server.HasExited) { $server.Kill() }
          Start-Sleep -Milliseconds 500

          Write-Host "=== Server output ==="
          Get-Content server_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Server stderr ==="
          Get-Content server_err.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client output ==="
          Get-Content client_out.txt -ErrorAction SilentlyContinue
          Write-Host "=== Client stderr ==="
          Get-Content client_err.txt -ErrorAction SilentlyContinue

          # Verify both apps started successfully (basic smoke check)
          $serverOut = Get-Content server_out.txt -Raw -ErrorAction SilentlyContinue
          $clientOut = Get-Content client_out.txt -Raw -ErrorAction SilentlyContinue
          if ($serverOut -match "Listening" -and $clientOut -match "Started") {
            Write-Host "Smoke test PASSED: both Java 11 JNI apps started successfully"
          } else {
            Write-Host "Smoke test FAILED: apps did not start properly"
            if ($client.HasExited) {
              Write-Host "Client exit code: $($client.ExitCode)"
            }
            exit 1
          }

      - name: Run standalone test suite
        shell: cmd
        run: conduit\scripts\run_tests.bat build-conduit

  # ── Java 21 Panama FFI / Linux ─────────────────────────────────────────────
