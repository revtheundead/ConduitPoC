name: Release

on:
  push:
    tags: ['v*']

  # Allow manual trigger for testing the workflow
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write   # needed for creating GitHub Releases

jobs:
  # ============================================================================
  # Build native artifacts on each platform
  # ============================================================================

  build-linux-x86_64:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (Release, all artifacts)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_CODEC_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Collect artifacts
        run: |
          mkdir -p staging/bin staging/lib staging/include
          cp build/bgen/bgen staging/bin/
          # Static libraries
          cp build/libconduit_codec.a staging/lib/ 2>/dev/null || true
          cp build/libconduit.a staging/lib/ 2>/dev/null || true
          # Shared libraries
          cp conduit/lib/libconduit_cabi.so staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_cabi.so staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_jni.so staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_jni.so staging/lib/ 2>/dev/null || true
          # Headers
          cp -r conduit/include/conduit staging/include/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: staging/

      # JNI libs needed for fat JAR assembly
      - name: Upload JNI native libs
        uses: actions/upload-artifact@v4
        with:
          name: jni-linux-x86_64
          path: |
            conduit/lib/libconduit_jni.so
            conduit/lib/libconduit_codec_jni.so

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (Release, all artifacts)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_CODEC_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Collect artifacts
        run: |
          mkdir -p staging/bin staging/lib staging/include
          cp build/bgen/bgen staging/bin/
          cp build/libconduit_codec.a staging/lib/ 2>/dev/null || true
          cp build/libconduit.a staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_cabi.so staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_cabi.so staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_jni.so staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_jni.so staging/lib/ 2>/dev/null || true
          cp -r conduit/include/conduit staging/include/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: staging/

      - name: Upload JNI native libs
        uses: actions/upload-artifact@v4
        with:
          name: jni-linux-aarch64
          path: |
            conduit/lib/libconduit_jni.so
            conduit/lib/libconduit_codec_jni.so

  build-macos-arm64:
    runs-on: macos-16   # Apple Silicon (M1+)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (Release, all artifacts)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_CODEC_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Collect artifacts
        run: |
          mkdir -p staging/bin staging/lib staging/include
          cp build/bgen/bgen staging/bin/
          cp build/libconduit_codec.a staging/lib/ 2>/dev/null || true
          cp build/libconduit.a staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_cabi.dylib staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_cabi.dylib staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_jni.dylib staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_jni.dylib staging/lib/ 2>/dev/null || true
          cp -r conduit/include/conduit staging/include/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: staging/

      - name: Upload JNI native libs
        uses: actions/upload-artifact@v4
        with:
          name: jni-macos-arm64
          path: |
            conduit/lib/libconduit_jni.dylib
            conduit/lib/libconduit_codec_jni.dylib

  build-macos-x86_64:
    runs-on: macos-16   # Cross-compile for Intel on Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (Release, cross-compile x86_64)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=OFF
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_CODEC_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64

      - name: Build
        run: cmake --build build --parallel

      - name: Collect artifacts
        run: |
          mkdir -p staging/bin staging/lib staging/include
          cp build/bgen/bgen staging/bin/
          cp build/libconduit_codec.a staging/lib/ 2>/dev/null || true
          cp build/libconduit.a staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_cabi.dylib staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_cabi.dylib staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_jni.dylib staging/lib/ 2>/dev/null || true
          cp conduit/lib/libconduit_codec_jni.dylib staging/lib/ 2>/dev/null || true
          cp -r conduit/include/conduit staging/include/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: staging/

      - name: Upload JNI native libs
        uses: actions/upload-artifact@v4
        with:
          name: jni-macos-x86_64
          path: |
            conduit/lib/libconduit_jni.dylib
            conduit/lib/libconduit_codec_jni.dylib

  build-windows-x86_64:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure (Release, all artifacts)
        run: >
          cmake -B build -S conduit
          -DCONDUIT_BUILD_BGEN=ON
          -DCONDUIT_BUILD_TESTS=ON
          -DCONDUIT_BUILD_CABI=ON
          -DCONDUIT_BUILD_CODEC_CABI=ON
          -DCONDUIT_BUILD_JNI=ON
          -DCONDUIT_BUILD_JAVA_JAR=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: cd build && ctest --build-config Release --output-on-failure --timeout 120

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p staging/bin staging/lib staging/include
          cp build/bgen/Release/bgen.exe staging/bin/ 2>/dev/null || cp build/bgen/bgen.exe staging/bin/ 2>/dev/null || true
          # Static libraries (MSVC puts .lib in Release/ subdir for multi-config)
          cp build/Release/conduit_codec.lib staging/lib/ 2>/dev/null || cp build/conduit_codec.lib staging/lib/ 2>/dev/null || true
          cp build/Release/conduit.lib staging/lib/ 2>/dev/null || cp build/conduit.lib staging/lib/ 2>/dev/null || true
          # Shared libraries (CMake output dir override puts DLLs in conduit/lib/)
          cp conduit/lib/conduit_cabi.dll staging/lib/ 2>/dev/null || true
          cp conduit/lib/conduit_codec_cabi.dll staging/lib/ 2>/dev/null || true
          cp conduit/lib/conduit_jni.dll staging/lib/ 2>/dev/null || true
          cp conduit/lib/conduit_codec_jni.dll staging/lib/ 2>/dev/null || true
          # Import libraries (.lib for DLLs)
          cp conduit/lib/conduit_cabi.lib staging/lib/ 2>/dev/null || true
          cp conduit/lib/conduit_codec_cabi.lib staging/lib/ 2>/dev/null || true
          # Headers
          cp -r conduit/include/conduit staging/include/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: staging/

      - name: Upload JNI native libs
        uses: actions/upload-artifact@v4
        with:
          name: jni-windows-x86_64
          path: |
            conduit/lib/conduit_jni.dll
            conduit/lib/conduit_codec_jni.dll

  # ============================================================================
  # Assemble fat JAR with all platform native libraries
  # ============================================================================

  assemble-fat-jar:
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-arm64
      - build-macos-x86_64
      - build-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "CONDUIT_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Using version: ${TAG#v}"

      - name: Sync project files to release version
        run: ./conduit/scripts/bump_version.sh "${{ env.CONDUIT_VERSION }}"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Download all JNI native libs from each platform build
      - name: Download JNI libs (linux-x86_64)
        uses: actions/download-artifact@v4
        with:
          name: jni-linux-x86_64
          path: native-libs/linux-x86_64/

      - name: Download JNI libs (linux-aarch64)
        uses: actions/download-artifact@v4
        with:
          name: jni-linux-aarch64
          path: native-libs/linux-aarch64/

      - name: Download JNI libs (macos-arm64)
        uses: actions/download-artifact@v4
        with:
          name: jni-macos-arm64
          path: native-libs/macos-arm64/

      - name: Download JNI libs (macos-x86_64)
        uses: actions/download-artifact@v4
        with:
          name: jni-macos-x86_64
          path: native-libs/macos-x86_64/

      - name: Download JNI libs (windows-x86_64)
        uses: actions/download-artifact@v4
        with:
          name: jni-windows-x86_64
          path: native-libs/windows-x86_64/

      - name: Stage native libs into Maven resource directory
        run: |
          # Directory names MUST match what NativeLoader.detectOsArch() produces
          # at runtime.  Java's os.arch returns "aarch64" on ARM64 (both Linux
          # and macOS), so the resource path is macos-aarch64 / linux-aarch64.
          RESOURCES=conduit/bindings/java/src/main/resources/native
          mkdir -p $RESOURCES/linux-x86_64
          mkdir -p $RESOURCES/linux-aarch64
          mkdir -p $RESOURCES/macos-aarch64
          mkdir -p $RESOURCES/macos-x86_64
          mkdir -p $RESOURCES/windows-x86_64

          # The download-artifact action may nest files under conduit/lib/ or
          # place them flat depending on version.  Handle both cases.
          find native-libs/linux-x86_64 -name '*.so' -exec cp {} $RESOURCES/linux-x86_64/ \;
          find native-libs/linux-aarch64 -name '*.so' -exec cp {} $RESOURCES/linux-aarch64/ \;
          find native-libs/macos-arm64 -name '*.dylib' -exec cp {} $RESOURCES/macos-aarch64/ \;
          find native-libs/macos-x86_64 -name '*.dylib' -exec cp {} $RESOURCES/macos-x86_64/ \;
          find native-libs/windows-x86_64 -name '*.dll' -exec cp {} $RESOURCES/windows-x86_64/ \;

          echo "=== Bundled native libraries ==="
          find $RESOURCES -type f | sort

      - name: Build fat JAR with Maven
        run: mvn package -B -q -f conduit/bindings/java/pom.xml

      - name: Verify JAR contents
        run: |
          JAR=conduit/bindings/java/target/conduit-java-${{ env.CONDUIT_VERSION }}.jar
          echo "=== JAR contents (native/) ==="
          jar tf "$JAR" | grep "^native/" || echo "WARNING: no native/ entries found"
          echo "=== JAR size ==="
          ls -lh "$JAR"

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: conduit-java-fat-jar
          path: conduit/bindings/java/target/conduit-java-${{ env.CONDUIT_VERSION }}.jar

  # ============================================================================
  # Package and publish GitHub Release
  # ============================================================================

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86_64
      - build-linux-aarch64
      - build-macos-arm64
      - build-macos-x86_64
      - build-windows-x86_64
      - assemble-fat-jar

    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag and version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "CONDUIT_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG}, version: ${TAG#v}"

      # Download all platform artifacts
      - name: Download linux-x86_64
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/linux-x86_64/

      - name: Download linux-aarch64
        uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: dist/linux-aarch64/

      - name: Download macos-arm64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: dist/macos-arm64/

      - name: Download macos-x86_64
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: dist/macos-x86_64/

      - name: Download windows-x86_64
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist/windows-x86_64/

      - name: Download fat JAR
        uses: actions/download-artifact@v4
        with:
          name: conduit-java-fat-jar
          path: dist/java/

      - name: Create platform archives
        run: |
          VERSION=${{ env.CONDUIT_VERSION }}
          TAG=${{ steps.tag.outputs.tag }}
          mkdir -p release

          # Linux x86_64
          cd dist/linux-x86_64
          tar czf ../../release/conduit-${VERSION}-linux-x86_64.tar.gz .
          cd ../..

          # Linux aarch64
          cd dist/linux-aarch64
          tar czf ../../release/conduit-${VERSION}-linux-aarch64.tar.gz .
          cd ../..

          # macOS arm64
          cd dist/macos-arm64
          tar czf ../../release/conduit-${VERSION}-macos-arm64.tar.gz .
          cd ../..

          # macOS x86_64
          cd dist/macos-x86_64
          tar czf ../../release/conduit-${VERSION}-macos-x86_64.tar.gz .
          cd ../..

          # Windows x86_64
          cd dist/windows-x86_64
          zip -r ../../release/conduit-${VERSION}-windows-x86_64.zip .
          cd ../..

          # Java fat JAR
          cp dist/java/conduit-java-${VERSION}.jar release/

          echo "=== Release artifacts ==="
          ls -lh release/

      - name: Create source archive
        run: |
          VERSION=${{ env.CONDUIT_VERSION }}
          git archive --format=tar.gz --prefix=conduit-${VERSION}/ HEAD \
            > release/conduit-${VERSION}-source.tar.gz

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Conduit ${{ steps.tag.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            release/*
