plugins {
    id 'java'
    id 'application'
}

group = 'com.conduit'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'io.conduit:conduit-java:0.1.0'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += ['--enable-preview']
}

// Code generation
// bgen --language java writes files into <output>/<pkg>/ so the srcDirs below
// must point to the source roots (one level above the package directory).
// Run: ./gradlew generateCode   (requires conduit/build/bgen to exist)
def bgenExe = System.getenv('BGEN_PATH') ?:
    "${rootProject.projectDir}/../conduit/build/bgen"

tasks.register('generateAsterix', Exec) {
    commandLine bgenExe,
        '--input',    "${projectDir}/asterix/asterix.bmdl.xml",
        '--output',   "${projectDir}/asterix/generated",
        '--language', 'java'
    inputs.dir("${projectDir}/asterix")
    outputs.dir("${projectDir}/asterix/generated")
}

tasks.register('generateAsterixAlt', Exec) {
    commandLine bgenExe,
        '--input',    "${projectDir}/asterix-alt/asterix-alt.bmdl.xml",
        '--output',   "${projectDir}/asterix-alt/generated",
        '--language', 'java'
    inputs.dir("${projectDir}/asterix-alt")
    outputs.dir("${projectDir}/asterix-alt/generated")
}

tasks.register('generateCode') {
    dependsOn 'generateAsterix', 'generateAsterixAlt'
    description = 'Regenerate Java sources from BMDL protocol definitions via bgen'
}

// Wire code generation into the Java compilation pipeline so that
// './gradlew build' automatically runs bgen when sources are stale.
tasks.named('compileJava') {
    dependsOn 'generateCode'
}

sourceSets {
    main {
        java {
            srcDirs = [
                'src/main/java',
                // Source roots: bgen creates the package subdir inside each of these.
                // e.g. for package "asterix": asterix/generated/asterix/*.java
                'asterix/generated',
                'asterix-alt/generated',
            ]
        }
    }
}

def cabiLibPath = "${rootProject.projectDir}/../conduit/build/libconduit_cabi.so"
def commonJvmArgs = [
    '--enable-preview',
    '--enable-native-access=ALL-UNNAMED',
    "-Dconduit.cabi.path=${cabiLibPath}",
    "-Djava.library.path=${rootProject.projectDir}/../conduit/build"
]

application {
    mainClass = 'com.conduit.xcvr.PocApp'
    applicationDefaultJvmArgs = commonJvmArgs
}

tasks.register('runPocApp', JavaExec) {
    mainClass = 'com.conduit.xcvr.PocApp'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = commonJvmArgs
    args = System.getProperty('appArgs', '').split(' ').findAll { it }
}

tasks.register('runDummyPeer', JavaExec) {
    mainClass = 'com.conduit.xcvr.DummyPeer'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = commonJvmArgs
    args = System.getProperty('appArgs', '').split(' ').findAll { it }
}
