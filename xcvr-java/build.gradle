plugins {
    id 'java'
    id 'application'
}

group = 'com.conduit'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Conduit Java bindings (built from ../conduit)
    implementation files('../conduit/build/libs/conduit.jar')
}

// Two runnable applications matching the C++ executables
application {
    mainClass = 'com.conduit.xcvr.PocApp'
}

// Register both apps as named tasks
tasks.register('runPocApp', JavaExec) {
    mainClass = 'com.conduit.xcvr.PocApp'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runDummyPeer', JavaExec) {
    mainClass = 'com.conduit.xcvr.DummyPeer'
    classpath = sourceSets.main.runtimeClasspath
}
