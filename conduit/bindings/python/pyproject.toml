[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "0.1.0"
description = "Python bindings for the Conduit binary protocol library"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
conduit-codegen = "conduit.codegen_cli:main"

[tool.setuptools.packages.find]
include = ["conduit*"]
