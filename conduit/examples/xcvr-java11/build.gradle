plugins {
    id 'java'
    id 'application'
}

group = 'com.conduit'
version = '1.1.6'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    implementation 'io.conduit:conduit-java:1.1.6'
}

// Code generation
// bgen --language java writes files into <output>/<pkg>/ so the srcDirs below
// must point to the source roots (one level above the package directory).
// Run: ./gradlew generateCode   (requires conduit/build/bgen/bgen to exist)
// Override bgen location: BGEN_PATH env var, -Pbgen.path=..., or edit the default.
def bgenBuildDir = "${rootProject.projectDir}/../conduit/build/bgen"
def bgenExe = System.getenv('BGEN_PATH') ?:
    (project.hasProperty('bgen.path') ? project.property('bgen.path') : null)

// Auto-detect: try common locations (single-config, then multi-config generators)
if (bgenExe == null) {
    def candidates = [
        "${bgenBuildDir}/bgen",
        "${bgenBuildDir}/bgen.exe",
        "${bgenBuildDir}/Release/bgen.exe",
        "${bgenBuildDir}/Release/bgen",
        "${bgenBuildDir}/Debug/bgen.exe",
        "${bgenBuildDir}/Debug/bgen",
    ]
    bgenExe = candidates.find { new File(it).exists() } ?: "${bgenBuildDir}/bgen"
}

def bgenFile = new File(bgenExe)

tasks.register('generateAsterix', Exec) {
    onlyIf { bgenFile.exists() && bgenFile.canExecute() }
    commandLine bgenExe,
        '--input',    "${projectDir}/asterix/asterix.bmdl.xml",
        '--output',   "${projectDir}/asterix/generated",
        '--language', 'java'
    inputs.dir("${projectDir}/asterix")
    outputs.dir("${projectDir}/asterix/generated")
}

tasks.register('generateAsterixAlt', Exec) {
    onlyIf { bgenFile.exists() && bgenFile.canExecute() }
    commandLine bgenExe,
        '--input',    "${projectDir}/asterix-alt/asterix-alt.bmdl.xml",
        '--output',   "${projectDir}/asterix-alt/generated",
        '--language', 'java'
    inputs.dir("${projectDir}/asterix-alt")
    outputs.dir("${projectDir}/asterix-alt/generated")
}

tasks.register('generateCode') {
    dependsOn 'generateAsterix', 'generateAsterixAlt'
    description = 'Regenerate Java sources from BMDL protocol definitions via bgen'
}

// Wire code generation into the Java compilation pipeline so that
// './gradlew build' automatically runs bgen when sources are stale.
// If bgen is not found, codegen tasks are skipped gracefully and
// the build proceeds with any previously generated sources.
tasks.named('compileJava') {
    dependsOn 'generateCode'
}

sourceSets {
    main {
        java {
            srcDirs = [
                'src/main/java',
                // Source roots: bgen creates the package subdir inside each of these.
                // e.g. for package "asterix": asterix/generated/asterix/*.java
                'asterix/generated',
                'asterix-alt/generated',
            ]
        }
    }
}

def libDir = "${rootProject.projectDir}/../conduit/lib"
def commonJvmArgs = [
    "-Djava.library.path=${libDir}",
]

application {
    mainClass = 'com.conduit.xcvr.PocApp'
    applicationDefaultJvmArgs = commonJvmArgs
}

tasks.register('runPocApp', JavaExec) {
    mainClass = 'com.conduit.xcvr.PocApp'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = commonJvmArgs
    args = System.getProperty('appArgs', '').split(' ').findAll { it }
}

tasks.register('runDummyPeer', JavaExec) {
    mainClass = 'com.conduit.xcvr.DummyPeer'
    classpath = sourceSets.main.runtimeClasspath
    jvmArgs = commonJvmArgs
    args = System.getProperty('appArgs', '').split(' ').findAll { it }
}
